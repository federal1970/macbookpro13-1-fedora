PACKAGE_NAME="snd-hda-codec-cs8409-mbp131"
PACKAGE_VERSION="20261004.f28e349"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} clean"
BUILT_MODULE_NAME[0]="snd-hda-codec-cs8409"
BUILT_MODULE_LOCATION[0]="hda/codecs/cirrus"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
# The private HDA headers under hda/ are those of Linux 7.2. A module built
# with them for another kernel series could disagree with the kernel about
# its structures, so do not build there at all.
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
